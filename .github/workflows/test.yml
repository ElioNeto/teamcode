name: test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun turbo typecheck --filter=teamcode --filter=@teamcode-ai/plugin --filter=@teamcode-ai/sdk
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Configure git identity
        run: |
          git config --global user.email "bot@teamcode.dev"
          git config --global user.name "teamcode"
      - name: Run unit tests
        run: bun turbo test:ci --filter=teamcode
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6
        with:
          report_paths: packages/*/.artifacts/unit/junit.xml
          check_name: "unit results"
          detailed_summary: true
          fail_on_failure: false

  go-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go-core/go.mod
          cache-dependency-path: go-core/go.sum
      - uses: ./.github/actions/setup-bun
      - name: Format check
        working-directory: go-core
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Vet
        working-directory: go-core
        run: go vet ./...
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          working-directory: go-core
      - name: Unit tests
        working-directory: go-core
        run: go test -race -count=1 ./...
      - name: Read budget
        working-directory: go-core
        run: go test -count=1 -run TestAllMessagesWithinBudget ./internal/sessiondb/
      - name: Build server
        working-directory: go-core
        run: go build -o build/go-core-server ./cmd/server
      - name: Parity and concurrency against TypeScript
        working-directory: packages/teamcode
        run: bun test test/gocore/
        env:
          GO_CORE_BINARY: ${{ github.workspace }}/go-core/build/go-core-server
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
