name: test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - run: bun turbo typecheck --filter=teamcode --filter=@teamcode-ai/plugin --filter=@teamcode-ai/sdk
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
      - name: Configure git identity
        run: |
          git config --global user.email "bot@teamcode.dev"
          git config --global user.name "teamcode"
      - name: Run unit tests
        run: bun turbo test:ci --filter=teamcode
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6
        with:
          report_paths: packages/*/.artifacts/unit/junit.xml
          check_name: "unit results"
          detailed_summary: true
          fail_on_failure: false
